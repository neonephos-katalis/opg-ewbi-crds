name: Sync Operator CRDs from opg-ewbi-operator

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      upstream_repo:
        description: 'Source repository (owner/name)'
        required: true
        default: 'neonephos-katalis/opg-ewbi-operator'
      upstream_branch:
        description: 'Branch to synchronize from'
        required: true
        default: 'main'
  repository_dispatch:
    types: [opg-operator-updated, upstream-sync]

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-crd:
    name: Synchronize Operator CRD Definitions
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout opg-ewbi-crds
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: opg-ewbi-crds
          persist-credentials: true

      - name: Checkout opg-ewbi-operator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ${{ github.event.inputs.upstream_repo || 'neonephos-katalis/opg-ewbi-operator' }}
          ref: ${{ github.event.inputs.upstream_branch || 'main' }}
          path: upstream-operator
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'

      - name: Capture Upstream Commit Info
        id: upstream_info
        run: |
          cd upstream-operator
          COMMIT_SHA=$(git rev-parse --short HEAD)
          COMMIT_MSG=$(git log -1 --pretty=%s)
          echo "sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "msg=${COMMIT_MSG}" >> "$GITHUB_OUTPUT"

      - name: Synchronize Operator CRD files
        run: |
          # Clean existing Go types and YAML manifests to eliminate orphan files
          rm -f opg-ewbi-crds/apis/operator/v1beta1/*.go
          rm -f opg-ewbi-crds/crds/operator/bases/*.yaml

          # Copy Go types to component folder
          mkdir -p opg-ewbi-crds/apis/operator/v1beta1
          cp upstream-operator/api/operator/v1beta1/*.go opg-ewbi-crds/apis/operator/v1beta1/

          # Copy YAML manifests to component folder
          mkdir -p opg-ewbi-crds/crds/operator/bases
          cp upstream-operator/config/crd/bases/*.yaml opg-ewbi-crds/crds/operator/bases/

          if [ -f upstream-operator/config/crd/kustomization.yaml ]; then
            cp upstream-operator/config/crd/kustomization.yaml opg-ewbi-crds/crds/operator/
          fi

          # Regenerate component install manifest
          cat opg-ewbi-crds/crds/operator/bases/*.yaml > opg-ewbi-crds/crds/operator/install.yaml

          # Regenerate top-level aggregated manifest
          cat opg-ewbi-crds/crds/*/bases/*.yaml > opg-ewbi-crds/install.yaml

          # Tidy go dependencies
          cd opg-ewbi-crds
          go mod tidy

      - name: Generate GitHub App Token
        id: app-token
        if: ${{ env.SYNC_APP_ID != '' && env.SYNC_APP_PRIVATE_KEY != '' }}
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        env:
          SYNC_APP_ID: ${{ secrets.SYNC_APP_ID }}
          SYNC_APP_PRIVATE_KEY: ${{ secrets.SYNC_APP_PRIVATE_KEY }}
        with:
          app-id: ${{ secrets.SYNC_APP_ID }}
          private-key: ${{ secrets.SYNC_APP_PRIVATE_KEY }}

      - name: Create Pull Request if changes detected
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ steps.upstream_info.outputs.sha }}
          COMMIT_MSG: ${{ steps.upstream_info.outputs.msg }}
        run: |
          cd opg-ewbi-crds
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected. Repository is already up to date."
            exit 0
          fi

          BRANCH_NAME="automation/sync-operator-crds"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH_NAME"
          git add .
          git commit -m "chore(sync): update operator CRDs from opg-ewbi-operator ($COMMIT_SHA)"

          # Push branch explicitly using repository token
          git push "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" "$BRANCH_NAME" --force

          # Check if PR already exists
          PR_EXISTS=$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[0].number // empty')
          if [ -n "$PR_EXISTS" ]; then
            echo "Pull Request #$PR_EXISTS already exists and was updated."
          else
            gh pr create \
              --title "chore(sync): update operator CRDs from main ($COMMIT_SHA)" \
              --body "Automated synchronization of operator CRD definitions from neonephos-katalis/opg-ewbi-operator main ($COMMIT_SHA): $COMMIT_MSG" \
              --base main \
              --head "$BRANCH_NAME"
          fi
